name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 同一分支重复推送时取消上一次，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端（单元 + 集成测试，H2）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 测试全部走 H2 内存库，不需要 MySQL
      - name: 运行测试
        working-directory: server
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/target/surefire-reports/
          if-no-files-found: ignore

  scripts:
    name: 脚本自检（.cmd 纯 ASCII / .ps1 有 BOM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 两条编码红线：.cmd 只能是 ASCII；.ps1 必须带 UTF-8 BOM
      # （历史上分别导致过 cmd 把中文拆坏执行出垃圾命令、PowerShell 按 ANSI 读中文吞掉代码）
      - name: 校验脚本编码
        run: |
          chmod +x toolbox.sh
          ./toolbox.sh check

  web:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 类型检查
        working-directory: web
        run: npm run typecheck

      - name: 构建
        working-directory: web
        run: npm run build
