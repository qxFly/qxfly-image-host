# qxfly-image-host 本地开发依赖：MySQL 8 + MinIO(S3 兼容存储)
# 启动：docker compose up -d
# 停止：docker compose down          （保留数据）
# 清空：docker compose down -v       （删除数据卷）
services:
  mysql:
    image: mysql:8.4
    container_name: pichost-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pichost123
      MYSQL_DATABASE: pichost
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - pichost-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppichost123"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pichost-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pichost-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 初始化一个公开读的存储桶，便于直接验证自建 S3 后端
  minio-init:
    image: minio/mc:latest
    container_name: pichost-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/pichost &&
      mc anonymous set download local/pichost &&
      echo 'MinIO bucket [pichost] ready: http://127.0.0.1:9000/pichost'
      "

volumes:
  pichost-mysql:
  pichost-minio:
